# SonarCloud Configuration
# https://sonarcloud.io

sonar.organization=sohail-coder
sonar.projectKey=sohail-coder_finpilot
sonar.projectName=FinPilot

# Source directories
sonar.sources=backend/src,frontend/src

# Test directories
sonar.tests=backend/tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/prisma/migrations/**,\
  **/seed.ts,\
  **/*.config.js,\
  **/*.config.ts

# Test exclusions from coverage
sonar.test.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/tests/**

# Coverage report (generated by Jest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# TypeScript file suffixes
sonar.typescript.file.suffixes=.ts,.tsx

# Encoding
sonar.sourceEncoding=UTF-8
